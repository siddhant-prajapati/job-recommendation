services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    env_file:
      - ./job-recommendation/.env
    environment:
      PORT: 3030
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s

  ui:
    build:
      context: ./job-recommendation-ui
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK: "false"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
