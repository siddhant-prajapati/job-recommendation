spring:
  application:
    name: job-recommendation

cognodb:
  uri: ${COGNODB_URI}
  username: ${COGNODB_USERNAME:cognodb}
  password: ${COGNODB_PASSWORD}
  database: ${COGNODB_DATABASE:neo4j}
  seed: ${COGNODB_SEED:false}
  seed-and-exit: ${COGNODB_SEED_AND_EXIT:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

server:
  error:
    include-message: always
  port: ${PORT:3030}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://*.vercel.app}