services:
  - type: web
    name: job-recommendation-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USERNAME
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false
      - key: COGNODB_DATABASE
        value: neo4j
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COGNODB_SEED
        value: "false"
